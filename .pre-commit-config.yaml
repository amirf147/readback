# Pre-commit configuration for repository safety & hygiene
# Install hooks locally with: pip install pre-commit && pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=3000']
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: check-repo-safety
        name: Check Secrets, Absolute Paths, & Hygiene
        entry: python scripts/check_repo_safety.py
        language: system
        pass_filenames: false
